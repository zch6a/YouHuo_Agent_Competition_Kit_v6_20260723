<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 底部标签栏的五个图标。
       这五个图标此前在 index / family / care / trust / judge 五个 HTML 里逐字复制了
       五遍，每份约 2.2KB——改一个图标要动五处，漏一处就是一页和其余四页长得不一样。
       没有构建步骤，跨页面去重只有外部 sprite 这一条路。

       每个 symbol 只留形状：stroke 颜色**和线宽**都不写，由引用处的 CSS 决定
       （`pages.css` 的 `.tab-icon`）。viewBox 与原内联 SVG 完全一致。

       线宽原先写在这里，是一个隐蔽的 bug：`<use>` 影子树里 `<symbol>` 自己的
       表现属性赢过从宿主继承来的值，所以 CSS 那条「当前 Tab 图标变粗」
       （2.3）从来没有生效过——而它是当前 Tab 声称的两条非颜色通道之一。 -->
  <symbol id="tab-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
  </symbol>
  <symbol id="tab-family" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 21a8 8 0 0 0-16 0" />
    <circle cx="10" cy="8" r="5" />
    <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
  </symbol>
  <symbol id="tab-care" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762" />
  </symbol>
  <symbol id="tab-trust" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    <path d="m9 12 2 2 4-4" />
  </symbol>
  <symbol id="tab-judge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />
    <circle cx="12" cy="8" r="6" />
  </symbol>

  <!-- ══════════════════════════════════════════════════════════════════════
       补齐：一个概念一个字形
       ══════════════════════════════════════════════════════════════════════
       上面五个 symbol 要服务**两个壳一共七个**导航概念：

           Elder   首页 / 记录 / 家人 / 我的
           Family  今天 / 待办 / 照护 / 我的

       于是出现了一字形兼两职：`tab-care`（心形）在 /elder 上表示「记录」、
       在 /care 上表示「照护」；`tab-trust`（盾形带勾）在 /elder 上表示「我的」。
       图标的语义本来就比文字弱，同一个形状指两件事，读者只能靠位置猜。

       判据来自参考产品研究（frontend_redesign/ia/12_reference_study.md 第二节 ③）：
       Medito 的 55 个图标里 `heart` / `health` / `home` / `privacy` / `profile` /
       `settings` 各是各的名字，**没有一个字形兼两职**；填充与描边才是同一概念的
       两个状态，用 `book`/`bookSolid` 这种显式配对表示。

       补下面四个之后：`tab-care` 只表示照护，`tab-trust` 只表示凭证。

       画法与上面五个完全一致（Lucide 24×24 描边，不写 stroke-width——那是
       第 10-12 行记着的那个坑：`<symbol>` 自己的表现属性会赢过宿主继承的值）。 -->

  <!-- 今天（Family）。日历带日期格子。elder.html 抽屉里「今天有什么事」那个
       内联图标用的是同一个形状，两处一致。 -->
  <symbol id="tab-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v4" />
    <path d="M16 2v4" />
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <path d="M3 10h18" />
    <path d="M8 14h.01" />
    <path d="M12 14h.01" />
    <path d="M16 14h.01" />
    <path d="M8 18h.01" />
    <path d="M12 18h.01" />
  </symbol>

  <!-- 待办（Family）。两个勾 + 三条列表线：这一格的内容就是
       「待我确认 / 进行中 / 已完成」。 -->
  <symbol id="tab-todo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 7 2 2 4-4" />
    <path d="m3 17 2 2 4-4" />
    <path d="M13 6h8" />
    <path d="M13 12h8" />
    <path d="M13 18h8" />
  </symbol>

  <!-- 记录（Elder）。原先借用 `tab-care` 的心形。
       这个形状不是新画的——它就是 elder.js 里「还没有记录」那个空态用的图标，
       所以标签和空态从此是同一个形状。 -->
  <symbol id="tab-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 3.4h11a1.6 1.6 0 0 1 1.6 1.6v14a1.6 1.6 0 0 1-1.6 1.6h-11A1.6 1.6 0 0 1 4.9 19V5a1.6 1.6 0 0 1 1.6-1.6z" />
    <path d="M8.4 9h7.2" />
    <path d="M8.4 13h7.2" />
    <path d="M8.4 17h4.4" />
  </symbol>

  <!-- 我的（两个壳共用）。原先借用 `tab-trust` 的盾形带勾——那个形状讲的是
       「查得清、对得上」，是凭证的意思，不是「这是我」。 -->
  <symbol id="tab-me" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" />
    <circle cx="12" cy="10" r="3" />
    <path d="M7 20.7V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.7" />
  </symbol>
</svg>
