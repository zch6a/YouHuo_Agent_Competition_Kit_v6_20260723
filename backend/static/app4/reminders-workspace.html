<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>提醒与记忆</title><link rel="stylesheet" href="/static/app4/reminders-workspace.css"><script src="/static/identity.js" defer></script><script src="/static/common.js" defer></script><script type="module" src="/static/app4/reminders-workspace.js"></script></head><body><main>
<nav aria-label="提醒与记忆"><button id="remTab" aria-pressed="true">提醒</button><button id="memTab" aria-pressed="false">记忆</button><button id="reload" class="subtle" aria-label="刷新列表">↻</button></nav>
<p id="message" role="status" hidden></p>
<section id="reminders"><header><div><h1>把小事记好</h1><p>到点提醒，办完打勾。</p></div><button id="addReminder">＋ 添加</button></header><form id="remForm" hidden><h2 id="remFormTitle">新提醒</h2><label>提醒什么<input id="remTitle" maxlength="120" required placeholder="例如：给花浇水"></label><label>什么时候<input id="remDue" type="datetime-local" required></label><label>未完成多久后通知家人<select id="escalation"><option value="30">30 分钟</option><option value="60">1 小时</option><option value="120">2 小时</option><option value="1440">1 天</option></select></label><div class="actions"><button type="submit">保存提醒</button><button id="cancelRem" type="button" class="subtle">取消</button></div></form><div id="remList" class="list" aria-live="polite">正在读取…</div><details id="past"><summary>已结束</summary><div id="pastList" class="list"></div></details></section>
<section id="memories" hidden><header><div><h1>替你记着</h1><p id="memoryNote">记住之前，先问本人。</p></div><button id="addMemory">＋ 添加</button></header><form id="memForm" hidden><h2>记住一件事</h2><label>名称<input id="memKey" maxlength="80" required placeholder="例如：午休习惯"></label><label>具体内容<textarea id="memDetail" maxlength="500" required placeholder="例如：下午一点到两点休息"></textarea></label><label>用来做什么<input id="memPurpose" maxlength="240" required placeholder="例如：提醒时避开午休"></label><label id="scopeLabel">谁可以看<select id="memScope"><option value="private">只有本人</option><option value="family_summary">家人只知道有这条，不看内容</option><option value="family_shared">与家人共享内容</option></select></label><p class="fine">默认保存 180 天，可随时忘记。</p><div class="actions"><button id="saveMemory" type="submit">保存并同意</button><button id="cancelMem" type="button" class="subtle">取消</button></div></form><div id="memList" class="list" aria-live="polite">正在读取…</div></section>
</main></body></html>
