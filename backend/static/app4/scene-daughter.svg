  <path d="M60 128 c-4 -30 8 -52 30 -52" fill="none" stroke="#f7c27a" stroke-width="0"/>
  <!-- 手臂 + 手机 -->
  <path d="M106 96 c8 2 14 8 16 16 l-8 4 c-2 -6 -6 -9 -10 -10z" fill="#ffe7b8"/>
  <rect x="112" y="96" width="14" height="22" rx="3" fill="#3b2a1e"/>
  <rect x="114" y="99" width="10" height="15" rx="1.5" fill="#ffd98a"/>
  <circle cx="116" cy="116" r="4.5" fill="#f6c9a0"/>
  <!-- 头 -->
  <rect x="84" y="62" width="12" height="16" rx="5" fill="#eab48a"/>
  <circle cx="90" cy="50" r="17" fill="#f6c9a0"/>
