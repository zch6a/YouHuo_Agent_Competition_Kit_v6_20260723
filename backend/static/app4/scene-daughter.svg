  <!-- 飘出的对话泡与心 -->
  <path d="M132 30 h40 a10 10 0 0 1 10 10 v16 a10 10 0 0 1 -10 10 h-26 l-10 8 v-8 h-4 a10 10 0 0 1 -10 -10 v-16 a10 10 0 0 1 10 -10z" fill="#fff"/>
  <path d="M152 58 c-10 -7 -14 -11 -14 -16 a5 5 0 0 1 9 -3 l5 5 l5 -5 a5 5 0 0 1 9 3 c0 5 -4 9 -14 16z" fill="#f29a38"/>
  <circle cx="120" cy="84" r="3" fill="#ffd36b"/><circle cx="112" cy="96" r="2" fill="#ffd36b"/>
  <!-- 沙发 -->
  <rect x="22" y="112" width="140" height="44" rx="18" fill="#7cc39a"/>
  <rect x="14" y="104" width="26" height="54" rx="12" fill="#5daa7e"/>
  <rect x="148" y="104" width="26" height="54" rx="12" fill="#5daa7e"/>
  <path d="M40 158 v12 M150 158 v12" stroke="#3f8f5f" stroke-width="6" stroke-linecap="round"/>
