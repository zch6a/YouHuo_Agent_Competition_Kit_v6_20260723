  <circle cx="92" cy="52" r="1.8" fill="#3b2a1e"/><circle cx="103" cy="52" r="1.8" fill="#3b2a1e"/>
  <path d="M94 59 q4 3 8 0" fill="none" stroke="#b5735a" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="88" cy="58" r="3" fill="#f29a8a" fill-opacity=".45"/><circle cx="106" cy="57" r="3" fill="#f29a8a" fill-opacity=".45"/>
  <ellipse cx="100" cy="176" rx="92" ry="4" fill="#e8a33d" fill-opacity=".18"/>
