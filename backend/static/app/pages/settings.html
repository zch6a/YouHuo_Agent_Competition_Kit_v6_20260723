<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>设置 · 优活</title><link rel="stylesheet" href="../assets/css/app.css"><link rel="stylesheet" href="../assets/css/app-art.css"><link rel="stylesheet" href="/static/art-cards.css"></head><body data-surface="consumer"><main class="phone"><div class="header-grid" style="margin-top:44px;grid-template-columns:48px 1fr 48px"><button class="back" data-goback="1" aria-label="返回上一页" style="width:48px;height:48px;padding:0;line-height:1">‹</button><h1 style="font-size:calc(29px * var(--fs,1))">设置</h1><span></span></div>
<img class="scene" src="../art/png/services_scene_left.png" style="left:-16px;top:150px;width:150px;opacity:.42" alt=""><img class="scene" src="../art/png/services_scene_right.png" style="right:-14px;top:150px;width:140px;opacity:.48" alt=""><img class="art" src="../art/png/service_settings.png" style="right:16px;top:58px;width:42px;height:42px;opacity:.6" alt=""><p class="sub content" style="margin-top:12px;font-size:calc(17px * var(--fs,1))">这里管两件事：字有多大，说话有多快。点一下就存好，下次打开还是这样。</p>

<section class="card content" style="margin-top:90px;padding:18px 16px"><h2 class="section-title" style="margin:0;font-size:calc(21px * var(--fs,1))">字有多大</h2><p class="muted" style="margin:8px 0 0;font-size:calc(15px * var(--fs,1))">下面四块牌子上的字，就是选了以后的大小。点一块您看得清的。</p>

rrentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-check style="visibility:hidden"><path d="M4.6 12.5 9.6 17.5 19.4 7.1"/></svg><span style="font-size:calc(30.4px * var(--fs, 1));line-height:1.15">最大</span></button></div>
<div class="card soft" style="box-shadow:none;margin-top:14px;padding:13px 14px"><small class="muted" id="fontNow" style="display:block;font-size:calc(13px * var(--fs,1))"></small><p id="fontPreview" style="margin:7px 0 0;font-size:calc(19px * var(--fs,1));line-height:1.45">今天上午八点，吃一次降压药。</p></div></section>
<section class="card content" style="margin-top:14px;padding:18px 16px"><h2 class="section-title" style="margin:0;font-size:calc(21px * var(--fs,1))">说话有多快</h2><p class="muted" style="margin:8px 0 0;font-size:calc(15px * var(--fs,1))">优活念给您听的时候，用这个快慢。</p>
<div id="voiceSpeedGroup" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px"><button class="btn secondary" data-voice-speed="0.8" aria-pressed="false" style="height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-check style="visibility:hidden"><path d="M4.6 12.5 9.6 17.5 19.4 7.1"/></svg><span style="font-size:calc(19px * var(--fs,1));line-height:1.15">慢</span></button><button class="btn secondary" data-voice-speed="1.0" aria-pressed="false" style="height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-check style="visibility:hidden"><path d="M4.6 12.5 9.6 17.5 19.4 7.1"/></svg><span style="font-size:calc(19px * var(--fs,1));line-height:1.15">正常</span></button><button class="btn secondary" data-voice-speed="1.2" aria-pressed="false" style="height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-check style="visibility:hidden"><path d="M4.6 12.5 9.6 17.5 19.4 7.1"/></svg><span style="font-size:calc(19px * var(--fs,1));line-height:1.15">快</span></button></div>
<p class="muted" id="speedNow" style="margin:12px 0 0;font-size:calc(15px * var(--fs,1))"></p></section>
<section class="card content" style="margin-top:14px;padding:18px 16px"><h2 class="section-title" style="margin:0;font-size:calc(21px * var(--fs,1))">看不清的时候</h2><p class="muted" style="margin:8px 0 0;font-size:calc(15px * var(--fs,1))">打开以后，字会更黑，底色会更干净，山水图案会淡下去。</p>
<button class="btn secondary" data-contrast="toggle" aria-pressed="false" style="width:100%;height:auto;min-height:76px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;text-align:left"><span style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0"><span style="font-size:calc(19px * var(--fs,1));font-weight:760">高对比</span><span class="muted" style="font-size:calc(13px * var(--fs,1));font-weight:500">让字和底色分得更开</span></span><span id="contrastState" class="service-flag" style="font-size:calc(15px * var(--fs,1))"></span></button></section>
<p class="muted content" style="margin:14px 0 0;font-size:calc(13px * var(--fs,1))">这些设置存在优活里，换一页、重新打开都还在。</p></main>
