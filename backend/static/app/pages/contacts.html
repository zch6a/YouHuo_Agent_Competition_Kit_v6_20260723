<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紧急联系人 · 优活</title><link rel="stylesheet" href="../assets/css/app.css"></head><body data-surface="consumer"><main class="phone"><div class="header-grid" style="margin-top:44px;grid-template-columns:48px 1fr 48px"><button class="back" data-goback="1" aria-label="返回上一页" style="width:48px;height:48px;padding:0;line-height:1">‹</button><h1 style="font-size:calc(29px * var(--fs,1))">紧急联系人</h1><span></span></div>
<img class="scene" src="../art/png/record_scene_left.png" style="left:-10px;top:152px;width:180px;opacity:.55" alt=""><img class="scene" src="../art/png/record_scene_right.png" style="right:-10px;top:152px;width:160px;opacity:.62" alt=""><p class="sub content" style="margin-top:12px;font-size:calc(17px * var(--fs,1))">遇到急事的时候，优活会按下面的顺序，一位一位地联系他们。</p>
<h2 class="section-title content" id="primaryTitle" style="margin:108px 0 10px;font-size:calc(21px * var(--fs,1))" hidden>主要联系人</h2><section class="card content" id="primaryBox" style="padding:17px" hidden></section>
<h2 class="section-title content" id="otherTitle" style="margin:20px 0 10px;font-size:calc(21px * var(--fs,1))" hidden>其他联系人</h2><section class="card content" id="otherBox" style="padding:2px 17px" hidden></section>
<section class="card soft content" id="contactsEmpty" style="margin-top:108px;padding:20px 17px" hidden><b style="display:block;font-size:calc(19px * var(--fs,1))">还没有登记联系人</b><p class="muted" style="margin:9px 0 0;font-size:calc(15px * var(--fs,1))">这里一位都没有。请家人在优活的家人端里，先把您的家人加进来。</p></section>
<section class="card soft content" style="margin-top:16px;padding:18px 17px"><b style="display:block;font-size:calc(19px * var(--fs,1))">这里为什么没有电话号码</b><p class="muted" style="margin:9px 0 0;font-size:calc(15px * var(--fs,1))">优活现在只记住了称呼，还没有记电话。没有号码就不写出来，免得您按下去拨错了人。</p><button class="btn secondary" data-open="phoneModal" style="width:100%;height:56px;margin-top:14px;font-size:calc(17px * var(--fs,1))">让家人补一个</button></section>
<button class="card content" data-open="sosModal" style="width:100%;min-height:96px;margin-top:16px;border:1px solid #f0c4ba;background:linear-gradient(135deg,#fff5f2,#ffe9e4);text-align:left;padding:18px 20px 18px 96px;cursor:pointer"><img class="art" src="../art/png/profile_sos.png" style="left:15px;top:15px;width:66px;height:66px" alt=""><b style="display:block;color:#c0392b;font-size:calc(23px * var(--fs,1))">紧急呼叫</b><small class="muted" style="display:block;margin-top:6px;font-size:calc(15px * var(--fs,1))">按一下，优活会先问您一次</small></button>
<p class="content" id="sosState" hidden style="margin:12px 0 0;padding:13px 15px;border-radius:14px;background:#eaf7ee;border:1px solid #a2d5b6;color:#1c6339;font-size:calc(15px * var(--fs,1))"></p><p class="muted content" style="margin:12px 0 0;font-size:calc(13px * var(--fs,1))">呼叫会被记在办理记录里，家人也看得到。</p></main>
<div id="sosModal" class="modal"><div class="modal-box"><h2 style="margin:0;font-size:calc(25px * var(--fs,1))">真的要呼叫吗</h2><p class="muted" style="margin:12px 0 0;font-size:calc(17px * var(--fs,1))">优活会记下这一次呼叫，并按上面的顺序联系他们。不急的话可以先等等。</p><button class="btn primary" data-sos="confirm" style="width:100%;height:60px;margin-top:18px;font-size:calc(19px * var(--fs,1));background:linear-gradient(135deg,#ff745d,#dc4335);box-shadow:0 10px 24px rgba(220,67,53,.25)">立即呼叫</button><button class="btn secondary" data-close="1" style="width:100%;height:56px;margin-top:10px;font-size:calc(19px * var(--fs,1))">再等等</button></div></div>
<div id="phoneModal" class="modal"><div class="modal-box"><h2 style="margin:0;font-size:calc(25px * var(--fs,1))">怎么补上电话</h2><p class="muted" style="margin:12px 0 0;font-size:calc(17px * var(--fs,1))">电话要家人来填，您不用自己弄：</p><p class="muted" style="margin:10px 0 0;font-size:calc(17px * var(--fs,1))">一、请家人打开优活的家人端。</p><p class="muted" style="margin:6px 0 0;font-size:calc(17px * var(--fs,1))">二、在「家庭成员」里找到自己的名字。</p><p class="muted" style="margin:6px 0 0;font-size:calc(17px * var(--fs,1))">三、把常用号码填进去，这一页就会显示出来。</p><button class="btn primary" data-close="1" style="width:100%;height:56px;margin-top:18px;font-size:calc(19px * var(--fs,1))">知道了</button></div></div>
<script src="../assets/js/config.js"></script><script src="../assets/js/mock-api.js"></script><script src="../assets/js/api-client.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/page-contacts.js"></script></body></html>
