<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>用药提醒 · 优活</title><link rel="stylesheet" href="../assets/css/app.css"></head><body data-surface="consumer"><main class="phone"><div class="header-grid" style="margin-top:44px;grid-template-columns:48px 1fr 48px"><button class="back" data-action="back" aria-label="返回上一页" style="width:48px;height:48px;font-size:calc(34px * var(--fs, 1));line-height:1">‹</button><h1>用药提醒</h1><span></span></div>
<img class="scene" src="../art/png/services_scene_left.png" style="left:-20px;top:100px;width:142px;opacity:.42" alt=""><img class="scene" src="../art/png/record_scene_right.png" style="right:-16px;top:112px;width:148px;opacity:.5" alt=""><section class="content" style="margin-top:13px"><p class="sub" id="medSummary" style="margin:0;min-height:25px"></p></section><section class="content" id="medList" style="margin-top:10px"></section><section class="card content" style="margin-top:16px;padding:16px 16px 18px"><div class="row between"><b class="section-title">加一条提醒</b><img src="../art/png/service_todo.png" style="width:40px;height:40px;object-fit:contain" alt=""></div><p class="muted" style="font-size:calc(15px * var(--fs, 1));margin:8px 0 0">填上要吃的药和时间，存下来就会到点提醒您。</p><button class="btn primary" id="medAddToggle" data-do="toggle" style="width:100%;height:58px;margin-top:13px">加一条提醒</button><div id="medForm" hidden style="margin-top:15px"><label for="medTitle" style="display:block;font-size:calc(15px * var(--fs, 1));font-weight:760">要提醒的事</label><input id="medTitle" type="text" autocomplete="off" placeholder="比如：吃钙片" style="width:100%;height:56px;margin-top:7px;padding:0 14px;border:1px solid #c89958;border-radius:16px;background:#fffaf1;color:#2a1f17;font-size:calc(18px * var(--fs, 1));font-family:inherit"><label for="medTime" style="display:block;font-size:calc(15px * var(--fs, 1));font-weight:760;margin-top:15px">提醒时间</label><div class="row" style="gap:8px;margin-top:7px"><button class="btn secondary" data-do="pick" data-time="07:30" style="flex:1;height:48px;font-size:calc(15px * var(--fs, 1))">早上 07:30</button><button class="btn secondary" data-do="pick" data-time="12:00" style="flex:1;height:48px;font-size:calc(15px * var(--fs, 1))">中午 12:00</button><button class="btn secondary" data-do="pick" data-time="18:00" style="flex:1;height:48px;font-size:calc(15px * var(--fs, 1))">傍晚 18:00</button></div><input id="medTime" type="time" step="60" style="width:100%;height:56px;margin-top:9px;padding:0 14px;border:1px solid #c89958;border-radius:16px;background:#fffaf1;color:#2a1f17;font-size:calc(18px * var(--fs, 1));font-family:inherit"><p class="muted" style="font-size:calc(13px * var(--fs, 1));margin:9px 0 0">不填时间，就按一个钟头以后提醒您；填的时间要是今天已经过了，会算到明天。</p><div class="row" style="gap:10px;margin-top:14px"><button class="btn primary" data-do="save" style="flex:1;height:58px">存下来</button><button class="btn secondary" data-do="close" style="flex:1;height:58px">先不加</button></div></div></section><button class="btn secondary content" data-do="all" style="width:100%;height:58px;margin-top:13px">看全部安排</button><p class="muted content" style="font-size:calc(13px * var(--fs, 1));margin:11px 0 0;line-height:1.5">这一页只列和吃药有关的提醒。就医、量血压这些在「全部安排」里。</p></main><script src="../assets/js/config.js"></script><script src="../assets/js/mock-api.js"></script><script src="../assets/js/api-client.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/page-medication.js"></script></body></html>
