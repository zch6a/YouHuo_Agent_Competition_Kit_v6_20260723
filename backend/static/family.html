<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- Matches the app bar so the phone status bar blends into the header. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png" />
  <!-- iOS ignores the manifest; these are what make "add to home screen" open
       fullscreen without Safari's chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="优活" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>优活家人端</title>
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/base.css" />
  <link rel="stylesheet" href="/static/components.css" />
  <link rel="stylesheet" href="/static/pages.css" />
  <script src="/static/register-sw.js"></script>
</head>
<body data-mode="youhuo" data-nav="tabbar">
  <main id="main" class="shell family-app">
    <header class="fam-head">
      <div class="fam-head-text">
        <h1>家里今天</h1>
        <p id="famUpdated" class="fam-updated">正在加载……</p>
      </div>
      <button id="refresh" class="secondary fam-refresh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg><span>刷新</span></button>
    </header>

    <!-- 操作结果条。这里原先用 alert()：在装到主屏的 PWA 里那是一个带域名的系统
         灰框，会冻住整页，而且读屏软件读不到。aria-live 让它对读屏可见。 -->
    <p id="familyNotice" class="notice good" role="status" aria-live="polite" hidden></p>

    <!-- 分区是页内的，不换路由：切换零延迟，service worker 外壳、start_url 和
         六条路由全部不动。当前分区写进 URL 的 hash，刷新后还在原地。 -->
    <nav class="segmented" aria-label="家人分区">
      <button type="button" class="seg is-current" data-section="today" aria-current="true">今天</button>
      <button type="button" class="seg" data-section="todo">待办</button>
      <button type="button" class="seg" data-section="trend">趋势</button>
      <button type="button" class="seg" data-section="mine">我的</button>
    </nav>

    <!-- 今天：这一页存在的理由。打开它的人想知道三件事——他今天怎么样、有没有
         需要我拍板的、今天还有什么。别的都往后排。 -->
    <section class="page-section" data-panel="today" aria-label="今天">
      <h2 class="section-head">今天怎么样</h2>
      <div id="dailyReport" aria-live="polite">正在生成……</div>
      <div class="metric-row">
        <div class="metric"><span class="metric-label">待您确认</span><strong id="mNeedYou">–</strong></div>
        <div class="metric"><span class="metric-label">进行中</span><strong id="mActive">–</strong></div>
        <div class="metric"><span class="metric-label">今天到期</span><strong id="mToday">–</strong></div>
      </div>
      <h2 class="section-head">需要您处理</h2>
      <p class="section-note">缴费、身份认证和超时的事，会在这里等您点头。</p>
      <div id="tasks"></div>
    </section>

    <section class="page-section" data-panel="todo" aria-label="待办" hidden>
      <h2 class="section-head">按日期</h2>
      <div id="calendar"></div>
      <h2 class="section-head">给他添一件事</h2>
      <form id="reminderForm">
        <label>事项<input id="reminderTitle" required placeholder="例如：复诊前准备病历" /></label>
        <label>时间<input id="reminderDue" type="datetime-local" required /></label>
        <label>到期后多少分钟没确认就通知我<input id="escalation" type="number" min="5" max="1440" value="30" /></label>
        <button type="submit"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8" /> <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /> <path d="m8 17 4-4 4 4" /></svg><span>同步到他的手机</span></button>
      </form>
      <p class="section-note">添好之后，会在提前一天、提前半天和提前一小时各提醒他一次。</p>
      <h2 class="section-head">通知</h2>
      <div id="notices"></div>
    </section>

    <section class="page-section" data-panel="trend" aria-label="趋势" hidden>
      <h2 class="section-head">这一周</h2>
      <p class="section-note">和他<strong>自己</strong>的常态比，不和别人比。聊天原文不会出现在这里，只有汇总。</p>
      <div id="weekly"></div>
    </section>

    <section class="page-section" data-panel="mine" aria-label="我的" hidden>
      <h2 class="section-head">做过的事</h2>
      <div class="metric-row metric-row-one">
        <div class="metric"><span class="metric-label">记录</span><strong id="mChain">–</strong></div>
      </div>
      <p id="chain" class="notice"></p>
      <div id="audit"></div>
      <p class="section-note">这里是给家人看的说法。逐条的原始记录、校验算法和证明过程在<a href="/trust" class="inline-tap">可信中心</a>。</p>
      <h2 class="section-head">其他</h2>
      <div class="fam-links">
        <a href="/care" class="fam-link">照护档案</a>
        <a href="/trust" class="fam-link">可信中心</a>
      </div>
      <button id="scheduler" class="secondary"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 14v2.2l1.6 1" /> <path d="M16 2v3" /> <path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338" /> <path d="M3 9h5.859" /> <path d="M8 2v3" /> <circle cx="16" cy="16" r="6" /></svg><span>立即检查到期待办</span></button>
      <p class="section-note">提前提醒和超时升级要靠这一步推进。现在还没有后台定时器，所以需要手动催一下——正式环境会由服务端定时触发。</p>
    </section>

    <nav class="tabbar" aria-label="主要分区">
      <a href="/" class="tab"><svg class="tab-icon" width="24" height="24" aria-hidden="true"><use href="/static/icons/tabs.svg#tab-home" /></svg><span>首页</span></a>
      <a href="/family" class="tab is-current" aria-current="page"><svg class="tab-icon" width="24" height="24" aria-hidden="true"><use href="/static/icons/tabs.svg#tab-family" /></svg><span>家人</span></a>
      <a href="/care" class="tab"><svg class="tab-icon" width="24" height="24" aria-hidden="true"><use href="/static/icons/tabs.svg#tab-care" /></svg><span>照护</span></a>
    </nav>
  </main>
  <script src="/static/identity.js"></script>
    <script src="/static/common.js"></script>
    <script src="/static/family.js"></script>
</body>
</html>
