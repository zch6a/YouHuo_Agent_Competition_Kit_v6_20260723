<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- Matches the app bar so the phone status bar blends into the header. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png" />
  <!-- iOS ignores the manifest; these are what make "add to home screen" open
       fullscreen without Safari's chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="优活" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>优活</title>
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/base.css" />
  <link rel="stylesheet" href="/static/components.css" />
  <link rel="stylesheet" href="/static/pages.css" />
  <script src="/static/register-sw.js"></script>
</head>
<body data-mode="youhuo">
  <!-- 这一页做一件事：问你是谁，然后送你去对应的那一端。
       此前它是一份项目目录——390px 下 8574px、六张导航卡、九个工程术语、一整块
       「工程证据」，而视觉权重最高的卡片是「五分钟决赛导览」。一个真实用户（老人
       或他的子女）在那一页上没有任何可以完成的事。 -->
  <main id="main" class="landing">
    <div class="landing-brand">
      <span class="landing-mark" aria-hidden="true">优</span>
      <h1>优活</h1>
      <p class="landing-tagline">让日常生活简单一点。</p>
    </div>

    <nav class="role-choice" aria-label="选择身份">
      <a href="/elder" class="role-pick" data-role="elder">
        <span class="role-pick-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3" /><path d="M8 22h8" /><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M19 10v1a7 7 0 0 1-14 0v-1" /></svg>
        </span>
        <strong>我是老人</strong>
        <span class="role-pick-note">说一句话，剩下的交给优活</span>
      </a>
      <a href="/family" class="role-pick" data-role="family">
        <span class="role-pick-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0" /><circle cx="10" cy="8" r="5" /><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" /></svg>
        </span>
        <strong>我是家人</strong>
        <span class="role-pick-note">看看今天怎么样，有没有需要我的</span>
      </a>
    </nav>

    <p id="landingHint" class="landing-hint" role="status" aria-live="polite" hidden></p>

    <p class="landing-demo">
      <a href="/judge">演示与可信技术 →</a>
    </p>
    <!-- 桌面演示入口。和上面那行并列放在最末：它对老人和家属都没有意义，只有在电脑上
         做答辩、录屏或截图的人才需要它。手机上打开它会直说"用应用本身"。 -->
    <p class="landing-demo">
      <a href="/stage">在电脑上演示 →</a>
    </p>
  </main>
  <script src="/static/landing.js" defer></script>
</body>
</html>
