<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- Matches the app bar so the phone status bar blends into the header. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0e0c" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png" />
  <!-- iOS ignores the manifest; these are what make "add to home screen" open
       fullscreen without Safari's chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="优活" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>优活</title>
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/base.css" />
  <link rel="stylesheet" href="/static/components.css" />
  <link rel="stylesheet" href="/static/pages.css" />
  <script src="/static/register-sw.js"></script>
</head>
<body data-mode="youhuo" data-surface="consumer">
  <!-- 直接双击 HTML 打开时唯一会说话的东西。
       这一段平时被 base.css 的 `.needs-server { display: none }` 藏着。而
       `file://` 下四个样式表全部 404（它们是 `/static/...` 绝对路径），于是这一段
       就露出来——一片黑屏至少变成一句话。
       它不用 JS：JS 在 file:// 下同样取不到。也不用内联脚本：严格 CSP 禁止。
       CSS 藏、CSS 失效即现，是这个约束下唯一还能工作的机制。 -->
  <p class="needs-server">
    这个页面要用服务器打开，不能直接双击 HTML 文件。<br />
    在项目根目录运行 <b>run_demo.ps1</b>（Windows）或 <b>run_demo.sh</b>，
    然后访问 <b>http://127.0.0.1:8041/</b>
  </p>
  <!-- 这一页做一件事：问你是谁，然后送你去对应的那一端。
       此前它是一份项目目录——390px 下 8574px、六张导航卡、九个工程术语、一整块
       「工程证据」，而视觉权重最高的卡片是「五分钟决赛导览」。一个真实用户（老人
       或他的子女）在那一页上没有任何可以完成的事。 -->
  <main id="main" class="landing">
    <div class="landing-brand">
      <span class="landing-mark" aria-hidden="true">优</span>
      <h1>优活</h1>
      <p class="landing-tagline">让日常生活简单一点。</p>
    </div>

    <nav class="role-choice" aria-label="选择身份">
      <a href="/elder" class="role-pick" data-role="elder">
        <span class="role-pick-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3" /><path d="M8 22h8" /><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M19 10v1a7 7 0 0 1-14 0v-1" /></svg>
        </span>
        <strong>我是老人</strong>
        <span class="role-pick-note">说一句话，剩下的交给优活</span>
      </a>
      <a href="/family" class="role-pick" data-role="family">
        <span class="role-pick-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0" /><circle cx="10" cy="8" r="5" /><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" /></svg>
        </span>
        <strong>我是家人</strong>
        <span class="role-pick-note">看看今天怎么样，有没有需要我的</span>
      </a>
    </nav>

    <p id="landingHint" class="landing-hint" role="status" aria-live="polite" hidden></p>

    <!-- 桌面才出现的那两个入口，放在最末。
         `/stage` 是在电脑上做答辩、录屏、截图的人用的舞台，`/judge` 是专业审计表面。
         这两件事在手机上都不成立：没有人在一台手机上做产品演示，也没有人在手机上逐条
         核对审计链。
         这一段此前写着「手机上打开它会直说『用应用本身』」——**那句话是假的**。
         那行字只存在于 `pages.css:1673` 的一句注释里；`stage.html` 里搜不到它，
         ≤900px 下那段样式做的只是把手机框摊平成单列（`pages.css:1674-1685`），
         页面一个字都不会提醒你走错了地方。所以留一条通往它的链接，是把人送进一个在
         这台设备上没有意义、而且不会自己说明的页面。
         把它们留在窄屏，还会把一张「你是谁」的两选一重新变成一份四项的目录——
         那正是这一页上一轮才刚去掉的形状。
         隐藏由 `.landing-wide` 负责（≥761px 才显示），断点与全站同一档。
         两条链接各套一层，而不是共用一层：`.landing` 是 flex 列、用 gap 分隔**直接**
         子元素，合并成一层会让这两行贴在一起。 -->
    <div class="landing-wide">
      <p class="landing-demo">
        <a href="/stage">产品演示 →</a>
      </p>
    </div>
    <div class="landing-wide">
      <p class="landing-demo">
        <a href="/judge">专业审计 →</a>
      </p>
    </div>
  </main>
  <script src="/static/landing.js" defer></script>
</body>
</html>
