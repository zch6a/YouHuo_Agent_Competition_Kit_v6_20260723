<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- Matches the app bar so the phone status bar blends into the header. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png" />
  <!-- iOS ignores the manifest; these are what make "add to home screen" open
       fullscreen without Safari's chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="优活" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>优活老人端 · v6适老交互</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/register-sw.js"></script>
</head>
<body data-mode="youhuo" data-activity="idle">
  <div class="role-halo" aria-hidden="true"></div>
  <main id="main" class="shell shell-wide app-frame">

    <header class="app-bar">
      <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        返回
      </a>
      <div id="modeBadge" class="badge"><span class="status-dot"></span><span id="modeName">优活办事模式</span></div>
    </header>

    <div class="elder-layout">

      <section class="panel stage">
        <div id="roleHeader" class="role-header mode-fade">
          <div class="role-icon" aria-hidden="true">
            <svg class="icon-youhuo" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6 21.4 12 12 21.4 2.6 12z"/><path d="M12 7.6 16.4 12 12 16.4 7.6 12z"/></svg>
            <svg class="icon-companion" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 8.6c0 5.2-8.6 10.4-8.6 10.4S3.4 13.8 3.4 8.6a4.4 4.4 0 0 1 8.6-1.4 4.4 4.4 0 0 1 8.6 1.4z"/></svg>
          </div>
          <div class="role-titles">
            <h1 id="agentTitle">优活</h1>
            <p id="roleOpening" class="role-opening">我在，您请说。</p>
          </div>
        </div>

        <div id="chat" class="chat" aria-live="polite"></div>
        <div id="relianceHost"></div>

        <div class="mic-stage">
          <div class="mic-dial">
            <button id="mic" class="mic-big" title="按一下开始说话" aria-label="按一下开始说话">
              <svg viewBox="0 0 24 24" width="62" height="62" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19v3" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <rect x="9" y="2" width="6" height="13" rx="3" /></svg>
            </button>
          </div>
          <div id="micHint" class="mic-hint">按一下，然后慢慢说</div>
        </div>

        <div class="composer">
          <div class="quick">
            <button data-text="帮我挂明天下午两点第一医院骨科王医生的号">演示挂号</button>
            <button data-text="帮我交水费">演示缴费</button>
            <button data-text="提醒我明天上午九点复诊">演示提醒</button>
          </div>
          <div class="controls">
            <input id="text" aria-label="对优活说" placeholder="也可以打字：帮我挂明天下午的骨科号" />
            <button id="send">发送</button>
          </div>
          <!-- The sheet is reachable by a real labelled button, not only by a
               swipe: gesture-only affordances fail this audience first. Hidden
               on wide screens, where the same content is already the sidebar. -->
          <button id="openExtras" class="secondary sheet-trigger" data-sheet-open aria-expanded="false" aria-controls="extrasSheet">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16" /><path d="M4 6h16" /><path d="M4 18h16" /></svg>
            <span>待办、常用和设置</span>
          </button>
          <div id="status" class="meta status-line"></div>
        </div>
      </section>

      <!-- On a phone this whole column lives in a bottom sheet so the
           conversation owns the screen; on a wide viewport the CSS leaves it as
           the sidebar it has always been. -->
      <div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true"></div>
      <aside id="extrasSheet" class="rail sheet" aria-label="待办、常用功能与设置">
        <button class="sheet-handle" data-sheet-close aria-label="收起">
          <span class="sheet-grip" aria-hidden="true"></span>
        </button>
        <section class="panel rail-card">
          <div class="rail-head">
            <h2>我的待办</h2>
            <span class="rail-note">最要紧的三件</span>
          </div>
          <div id="reminders"></div>
          <button id="toggleReminders" class="secondary block">查看全部待办</button>
        </section>

        <section class="panel rail-card">
          <div class="rail-head"><h2>常用</h2></div>
          <div class="home-entries" aria-label="主要入口">
            <button id="companionEntry" class="secondary entry-btn">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg>
              <span id="companionEntryLabel">找无忧伴聊聊</span>
            </button>
            <button id="logEntry" class="secondary entry-btn">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></svg>
              <span id="logEntryLabel">查看我的记录</span>
            </button>
            <button id="repeatLast" class="secondary entry-btn">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></svg>
              <span>再说一遍</span>
            </button>
            <button id="stepBack" class="secondary entry-btn">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20v-7a4 4 0 0 0-4-4H4" /> <path d="M9 14 4 9l5-5" /></svg>
              <span>返回上一步</span>
            </button>
          </div>
        </section>

        <section class="panel rail-card">
          <div class="rail-head">
            <h2>问问看</h2>
            <span class="rail-note">照护类问题，直接开口</span>
          </div>
          <div class="home-entries" aria-label="照护类提问">
            <button class="secondary entry-btn" data-text="我今天吃药了吗">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" /> <path d="m8.5 8.5 7 7" /></svg>
              <span>今天吃药了吗</span>
            </button>
            <button class="secondary entry-btn" data-text="我的药还够吃吗">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /> <path d="M12 22V12" /> <polyline points="3.29 7 12 12 20.71 7" /> <path d="m7.5 4.27 9 5.15" /></svg>
              <span>药还够吃吗</span>
            </button>
            <button class="secondary entry-btn" data-text="我今天有什么事">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /> <path d="M16 2v3" /> <rect x="3" y="3" width="18" height="18" rx="2" /> <path d="M3 9h18" /> <path d="M8 13h.01" /> <path d="M12 13h.01" /> <path d="M16 13h.01" /> <path d="M8 17h.01" /> <path d="M12 17h.01" /> <path d="M16 17h.01" /></svg>
              <span>今天有什么事</span>
            </button>
            <button class="secondary entry-btn" data-text="我血压怎么样">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg>
              <span>上次的血压</span>
            </button>
          </div>
          <p class="rail-note">这些只念记录，不做医学判断。</p>
        </section>

        <section class="panel rail-card">
          <div class="rail-head"><h2>看得清、听得懂</h2></div>
          <div class="profile-tools" aria-label="适老交互设置">
            <label>语速
              <select id="speechRate">
                <option value="0.72">慢</option>
                <option value="0.88" selected>舒适</option>
                <option value="1.0">正常</option>
              </select>
            </label>
            <label>文字大小
              <select id="fontScale">
                <option value="1.1">较大</option>
                <option value="1.25" selected>大</option>
                <option value="1.5">特大</option>
              </select>
            </label>
          </div>
          <button id="saveProfile" class="secondary block">保存我的习惯</button>
          <div class="trust-line" aria-label="可信提示">
            <span id="semanticPill" class="trust-pill neutral">语义层：检测中…</span>
            <span id="voicePill" class="trust-pill neutral">语音：检测中…</span>
            <span class="trust-pill">一次只问一件事</span>
            <span class="trust-pill">高风险需要复述</span>
            <span class="trust-pill">不会自动扣款</span>
          </div>
        </section>
      </aside>
    </div>

    <section id="logPanel" class="panel log-panel" hidden>
      <div class="rail-head">
        <h2>我的记录</h2>
        <span class="rail-note">和无忧伴聊天的内容不会记在这里</span>
      </div>
      <div id="activityLog" class="log-list"></div>
    </section>
  </main>
  <script src="/static/identity.js"></script>
    <script src="/static/sheet.js" defer></script>
    <script type="module" src="/static/elder.js"></script>
</body>
</html>
