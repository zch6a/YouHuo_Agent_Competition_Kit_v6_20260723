<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/static/app4/phone-entry.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="优活" />
<link rel="manifest" href="/static/manifest-app4.webmanifest" />
<link rel="apple-touch-icon" href="/static/icons/family-apple-180.png" />
<meta name="theme-color" content="#fffdf6">
<title>优活 · 家人端</title>
<link rel="stylesheet" href="/static/app4/app4.css">
<script src="/static/app-bridge.js"></script>
<script src="/static/register-sw.js"></script>
<script src="/static/identity.js"></script>
<script src="/static/common.js"></script>
<script type="module" src="/static/app4/family4.js"></script>
<link rel="stylesheet" href="/static/app4/pet4.css">
<script type="module" src="/static/app4/pet4.js"></script>
<script type="module" src="/static/app4/shell4.js"></script>
<link rel="stylesheet" href="/static/app4/surfaces4.css">
<link rel="stylesheet" href="/static/app4/type4.css">
<link rel="stylesheet" href="/static/app4/journal4.css">
<link rel="stylesheet" href="/static/app4/pet-art4.css">
<link rel="stylesheet" href="/static/control-states.css">
</head>
<body class="a4-family" data-surface="consumer">
<div class="a4-app">

  <header class="a4-top">
    <div class="a4-loc">
      <img class="a4-logo" src="/static/app4/youhuo-logo.png" width="52" height="44" alt="">
      <h1 id="who">家里</h1>
    </div>
    <button class="a4-mode-label" type="button" data-goto="mine">家人模式<span aria-hidden="true">⌄</span></button>
  </header>

  <!-- ============ 首页 ============ -->
  <main class="a4-panel" data-panel="home">
    <section class="a4-hero">
      <p class="a4-date" id="heroDate">今天</p>
      <h2 class="a4-hero-name">家人的一天</h2>
      <p class="a4-hero-line" id="heroLine">正在看他今天过得怎么样</p>
      <img class="a4-hero-art" src="/static/app4/life-family.webp" width="1536" height="1024" fetchpriority="high" alt="">
      <button class="a4-hero-action" type="button" data-goto="care">
        <svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#heart"/></svg>
        <span>查看照护记录</span>
        <svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#chevron"/></svg>
      </button>
    </section>
    <section class="a4-banner" aria-label="今天">
      <div class="a4-slides" id="slides">
        <div class="a4-slide"><span class="tag">今天</span><strong>正在看今天的情况</strong></div>
      </div>
      <div class="a4-dots" aria-hidden="true"></div>
    </section>

    <nav class="a4-grid" aria-label="常用">
      <button type="button" data-goto="todo"><span class="ico r badge"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#shield"/></svg><b id="badge" hidden></b></span>待确认</button>
      <button type="button" data-feature="med"><span class="ico g"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#pill"/></svg></span>用药</button>
      <button type="button" data-feature="today"><span class="ico"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#pulse"/></svg></span>作息</button>
      <button type="button" data-feature="reminders"><span class="ico"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#bell"/></svg></span>提醒</button>
      <button type="button" data-goto="msg"><span class="ico"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#message"/></svg></span>消息</button>
      <button type="button" data-feature="history"><span class="ico"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#bill"/></svg></span>办过的事</button>
      <button type="button" data-goto="mine"><span class="ico g"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#family"/></svg></span>家人</button>
      <button type="button" data-goto="mine"><span class="ico"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#more"/></svg></span>更多</button>
    </nav>

    <section class="a4-sec">
      <div class="a4-sec-head">
        <h2>需要您确认</h2>
        <button class="a4-link" type="button" data-goto="todo">全部<svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#chevron"/></svg></button>
      </div>
      <div class="a4-card" id="approveHome"><p class="a4-empty">正在看</p></div>
    </section>

    <section class="a4-sec">
      <div class="a4-sec-head"><h2>今天该办的事</h2></div>
      <div class="a4-card" id="errands"><p class="a4-empty">正在看</p></div>
    </section>

    <section class="a4-sec">
      <div class="a4-sec-head">
        <h2>最新消息</h2>
        <button class="a4-link" type="button" data-goto="msg">全部<svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#chevron"/></svg></button>
      </div>
      <div class="a4-card" id="newsHome"><p class="a4-empty">正在看</p></div>
    </section>
  </main>

  <!-- ============ 待办 ============ -->
  <main class="a4-panel" data-panel="todo" hidden>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>等您点头</h2></div>
      <div class="a4-card" id="approveAll"><p class="a4-empty">正在看</p></div>
    </section>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>办过的事</h2></div>
      <div class="a4-card" id="doneList"><p class="a4-empty">正在看</p></div>
    </section>
  </main>

  <!-- ============ 照护 ============ -->
  <main class="a4-panel" data-panel="care" hidden>
<section class="a4-sec"><div class="a4-sec-head"><h2>照护档案</h2></div><div class="a4-settings"><button type="button" class="a4-setting" data-feature="med"><span>用药与服药记录</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="body"><span>血压与就诊</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="mood"><span>心情</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="safety"><span>安全与联系人</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="trend"><span>一周趋势</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="reminders"><span>提醒与记忆</span><span aria-hidden="true">›</span></button></div></section>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>今天的作息</h2></div>
      <div class="a4-card" id="channels"><p class="a4-empty">正在看</p></div>
    </section>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>吃药</h2></div>
      <div class="a4-card" id="meds"><p class="a4-empty">正在看</p></div>
    </section>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>提醒</h2></div>
      <div class="a4-card" id="reminders"><p class="a4-empty">正在看</p></div>
    </section>
  </main>

  <!-- ============ 消息 ============ -->
  <main class="a4-panel" data-panel="msg" hidden>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>全部消息</h2></div>
      <div class="a4-card" id="newsAll"><p class="a4-empty">正在看</p></div>
    </section>
  </main>

  <!-- ============ 我的 ============ -->
  <main class="a4-panel" data-panel="mine" hidden>
    <section class="a4-sec">
      <div class="a4-sec-head"><h2>家里的人</h2></div>
      <div class="a4-card" id="people"><p class="a4-empty">正在看</p></div>
    </section>
    <section class="a4-sec a4-settings" aria-label="设置"><button type="button" class="a4-setting" data-feature="reminders"><span>提醒与记忆<small>安排提醒，征求老人同意</small></span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="safety"><span>安全与联系人</span><span aria-hidden="true">›</span></button><button type="button" class="a4-setting" data-feature="history"><span>办事记录</span><span aria-hidden="true">›</span></button>
      <button type="button" class="a4-setting" data-feature="trust"><span>可信记录</span><span aria-hidden="true">›</span></button>
      <a class="a4-setting" href="/elder4"><span>切换到老人模式<small>当前：家人模式</small></span><span aria-hidden="true">›</span></a>
    </section>
  </main>

</div>

<nav class="a4-tabs" aria-label="底部导航">
  <button type="button" data-tab="home"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#home"/></svg>今天</button>
  <button type="button" data-tab="todo"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#check"/></svg>待确认</button>
  <button type="button" data-tab="care"><span class="orb"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#heart"/></svg></span>照护</button>
  <button type="button" data-tab="msg"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#message"/></svg>消息</button>
  <button type="button" data-tab="mine"><svg class="i" aria-hidden="true"><use href="/static/app4/icons.svg#user"/></svg>设置</button>
</nav>

<div class="a4-toast" id="toast" role="status" hidden></div>
</body>
</html>
