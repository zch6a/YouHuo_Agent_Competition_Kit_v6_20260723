[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youhuo-agent"
version = "6.0.0"
description = "Family-coordinated voice life agent for older adults"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "coverage==7.13.3", "PyYAML==6.0.3"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
